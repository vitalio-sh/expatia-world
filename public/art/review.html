<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expatia art review</title><style>body{background:#233437;color:#edf0da;font:14px system-ui;margin:20px}h1{font-size:24px}canvas{image-rendering:pixelated;max-width:100%}section{display:flex;flex-wrap:wrap;gap:12px}figure{margin:0;background:#34464a;padding:12px;display:grid;text-align:center}figcaption{font-size:12px;max-width:170px}#map{width:480px;height:480px}</style><h1>Expatia generated asset review</h1><p>Original Barcelona scene and real Seedance character frames. Frames show actual motion, facing, ground contact and alpha.</p><canvas id="map" width="960" height="960"></canvas><section id="assets"></section><script>
fetch('manifest.json').then(r=>r.json()).then(m=>{
 const bg=new Image();bg.src=m.map;const map=document.querySelector('#map').getContext('2d');let sprites=[];
 for(const[c,dirs]of Object.entries(m.characters))for(const[d,states]of Object.entries(dirs))for(const[s,a]of Object.entries(states)){if(!a)continue;const f=document.createElement('figure'),v=document.createElement('canvas'),label=document.createElement('figcaption');v.width=a.frameWidth||128;v.height=a.frameHeight||160;label.textContent=`${c} · ${d} · ${s} (${a.frames||1} frames)`;f.append(v,label);document.querySelector('#assets').append(f);const image=new Image();image.src=a.src;sprites.push({c,d,s,a,image,ctx:v.getContext('2d')});}
 function draw(t){if(bg.complete)map.drawImage(bg,0,0,960,960);for(const q of sprites){if(!q.image.complete||!q.image.naturalWidth)continue;const{a,image,ctx}=q,fw=a.frameWidth||image.naturalWidth,fh=a.frameHeight||image.naturalHeight,n=a.frames||1,columns=a.columns||1,i=Math.floor(t/1000*(a.fps||0))%n;ctx.clearRect(0,0,fw,fh);ctx.imageSmoothingEnabled=false;ctx.drawImage(image,i%columns*fw,Math.floor(i/columns)*fh,fw,fh,0,0,fw,fh);if(q.s==='walk'&&q.d==='south'){map.imageSmoothingEnabled=false;map.drawImage(image,i%columns*fw,Math.floor(i/columns)*fh,fw,fh,q.c==='courier'?185:455,q.c==='courier'?195:510,46,58);}}requestAnimationFrame(draw)}requestAnimationFrame(draw);
});
</script></html>
